<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harry Wahyudie — Lead Generation VA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c8a96e;
    --blue: #6b9fd4;
    --coral: #e8896a;
    --green: #4ade80;
    --dark: #0f0d0a;
    --dark2: #1a1410;
    --text: #e8e0d0;
    --muted: #a09880;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(200,169,110,0.08) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 40px 24px 60px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeUp 0.6s ease both;
  }

  .leads-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 100px;
    letter-spacing: 12px;
    color: transparent;
    -webkit-text-stroke: 2px var(--blue);
    line-height: 1;
    opacity: 0.85;
  }

  .tagline {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    line-height: 1.4;
    margin-top: 12px;
  }

  .tagline span {
    color: var(--coral);
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 28px 0;
    animation: fadeUp 0.6s 0.1s ease both;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .divider::after {
    background: linear-gradient(to left, transparent, var(--gold));
  }
  .divider-dot {
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
  }

  /* Bullets */
  .bullets {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 36px;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .bullet {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(200,169,110,0.2);
    border-radius: 8px;
    padding: 12px 16px;
    transition: border-color 0.2s, background 0.2s;
  }

  .bullet:hover {
    border-color: rgba(200,169,110,0.5);
    background: rgba(200,169,110,0.05);
  }

  .bullet-icon {
    width: 22px; height: 22px;
    background: var(--green);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .bullet-icon svg { display: block; }

  .bullet-text {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--text);
  }

  /* CTA Buttons */
  .cta-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 24px;
    border-radius: 8px;
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }

  .btn:hover { transform: translateY(-2px); opacity: 0.92; }
  .btn:active { transform: scale(0.98); }

  .btn-instagram {
    background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    color: #fff;
  }

  .btn-whatsapp {
    background: #25d366;
    color: #fff;
  }

  .btn-email {
    background: transparent;
    color: var(--gold);
    border: 1.5px solid var(--gold);
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
    animation: fadeUp 0.6s 0.4s ease both;
  }

  /* Corner decorations */
  .corners {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .corner {
    position: absolute;
    width: 40px; height: 40px;
  }

  .corner-tl { top: 16px; left: 16px; border-top: 2px solid var(--blue); border-left: 2px solid var(--blue); }
  .corner-tr { top: 16px; right: 16px; border-top: 2px solid var(--blue); border-right: 2px solid var(--blue); }
  .corner-bl { bottom: 16px; left: 16px; border-bottom: 2px solid var(--blue); border-left: 2px solid var(--blue); }
  .corner-br { bottom: 16px; right: 16px; border-bottom: 2px solid var(--blue); border-right: 2px solid var(--blue); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
